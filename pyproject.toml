[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-agent-experiments"
version = "0.1.0"
description = "Experimental evaluation of independent LLM agents"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "pydantic==2.12.3", "python-dotenv==1.2.1"]

[project.optional-dependencies]
dev = ["pytest==9.0.1"]

[project.scripts]
llm-experiment = "scripts.run_experiment:main"

[tool.setuptools.packages.find]
include = ["agents*", "controller*", "evaluation*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
